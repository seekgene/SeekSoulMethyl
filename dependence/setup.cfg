[metadata]
name = seeksoultools
version = 1.3.0
author = seekgenebio
author_email = tools@seekgene.com
url = https://github.com/seekgenebio/seeksoultools
description = A professional bioinformatics toolkit for comprehensive single-cell transcriptome analysis, supporting RNA-seq, V(D)J sequencing, and full-length transcriptome workflows with high accuracy and efficiency.
license = MIT
platform = Linux
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Science/Research
    Topic :: Scientific/Engineering :: Bio-Informatics
    Programming Language :: Python :: 3.10
    Natural Language :: English
[options]
packages = find:
package_dir = 
  = .

include_package_data=True

[options.packages.find]
where = .

[options.package_data]
seeksoultools = 
    utils/**
    fast/template/*.html
    fast/template/*.png
    fast/template/css/*
    fast/template/js/*

[options.entry_points]
console_scripts =
    seeksoultools = seeksoultools:cli
