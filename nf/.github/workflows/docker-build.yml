name: Docker Build and Check

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'dockfile/**'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'dockfile/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker-build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile:
          - path: dockfile/Dockerfile.env_seeksoulmethy
            name: seeksoulmethy
    
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.dockerfile.name }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ matrix.dockerfile.path }}
        push: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        outputs: type=docker,dest=/tmp/${{ matrix.dockerfile.name }}-image.tar

    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image-${{ matrix.dockerfile.name }}
        path: /tmp/${{ matrix.dockerfile.name }}-image.tar
        retention-days: 1

  docker-security-scan:
    runs-on: ubuntu-latest
    needs: docker-build-test
    strategy:
      matrix:
        dockerfile:
          - name: seeksoulmethy
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download Docker image artifact
      uses: actions/download-artifact@v4
      with:
        name: docker-image-${{ matrix.dockerfile.name }}
        path: /tmp

    - name: Load Docker image
      run: docker load --input /tmp/${{ matrix.dockerfile.name }}-image.tar

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.dockerfile.name }}:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-results-${{ matrix.dockerfile.name }}.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results-${{ matrix.dockerfile.name }}.sarif'

    - name: Run Trivy vulnerability scanner (table format)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.dockerfile.name }}:${{ github.sha }}
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

  docker-quality-check:
    runs-on: ubuntu-latest
    needs: docker-build-test
    strategy:
      matrix:
        dockerfile:
          - name: seeksoulmethy
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download Docker image artifact
      uses: actions/download-artifact@v4
      with:
        name: docker-image-${{ matrix.dockerfile.name }}
        path: /tmp

    - name: Load Docker image
      run: docker load --input /tmp/${{ matrix.dockerfile.name }}-image.tar

    - name: Test Docker image
      run: |
        # Get the image name from the loaded image
        IMAGE_NAME=$(docker images --format "table {{.Repository}}:{{.Tag}}" | grep -v REPOSITORY | head -1)
        echo "Testing image: $IMAGE_NAME"
        
        # Basic functionality test
        docker run --rm $IMAGE_NAME /bin/bash -c "echo 'Container started successfully'"
        
        # Check if essential tools are available
        if [[ "${{ matrix.dockerfile.name }}" == "seeksoulmethy" ]]; then
          docker run --rm $IMAGE_NAME /bin/bash -c "conda --version || micromamba --version"
        fi

    - name: Analyze image size
      run: |
        IMAGE_NAME=$(docker images --format "table {{.Repository}}:{{.Tag}}" | grep -v REPOSITORY | head -1)
        docker images $IMAGE_NAME
        
        # Check image size (warn if > 2GB)
        SIZE=$(docker images $IMAGE_NAME --format "{{.Size}}" | head -1)
        echo "Image size: $SIZE"

  docker-push:
    runs-on: ubuntu-latest
    needs: [docker-build-test, docker-security-scan, docker-quality-check]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    strategy:
      matrix:
        dockerfile:
          - path: dockfile/Dockerfile.env_seeksoulmethy
            name: seeksoulmethy
    
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.dockerfile.name }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ matrix.dockerfile.path }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max